<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Meeting</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      /* The window takes the height this content measures (see `fit_meeting_pill`),
         so nothing at this level may scroll or the measurement feeds itself and the
         window grows until it fills the display. The expanded card's transcript
         scrolls in an inner element instead. */
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/meeting/main.tsx"></script>
  </body>
</html>
