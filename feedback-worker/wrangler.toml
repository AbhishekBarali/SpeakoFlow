# SpeakoFlow feedback Worker: the in-app "Send feedback" form posts here, and
# each message becomes an issue in a private GitHub repository.
#
# One-time setup (from this folder):
#
#   1. bun install
#   2. bunx wrangler login
#   3. Give the Worker a GitHub credential. Pick ONE. Both need two repository
#      permissions: Issues = Read and write (the report) and Contents = Read
#      and write (screenshots are committed under attachments/YYYY-MM/ and
#      embedded in the issue). Without Contents, reports still arrive; the
#      issue just says its screenshots couldn't be stored.
#
#      a) GitHub App (recommended: issues are opened by "<app>[bot]", so GitHub
#         emails you about each one like any other new issue).
#         github.com/settings/apps/new → no webhook, Repository permissions:
#         Issues + Contents = Read and write, "Only on this account". Generate
#         a private key, then install the app on the feedback repository only.
#         (An existing App: add Contents, then accept the new permission on
#         the installation page, or uploads keep failing with 403.)
#           bunx wrangler secret put GITHUB_APP_ID
#           bunx wrangler secret put GITHUB_APP_PRIVATE_KEY   < the-downloaded.pem
#
#      b) Fine-grained personal access token, limited to the feedback
#         repository with Issues + Contents = Read and write.
#           bunx wrangler secret put GITHUB_TOKEN
#         Issues are then opened as you, and GitHub does not email you about
#         your own activity unless Settings → Notifications → "Include your own
#         updates" is on.
#
#   4. bunx wrangler deploy
#   5. curl https://feedback.speakoflow.com/health   → ok
#
# The app sends to https://feedback.speakoflow.com/v1/feedback
# (FEEDBACK_ENDPOINT in src-tauri/src/feedback.rs). Change both together.

name = "speakoflow-feedback"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

# speakoflow.com is a zone on the same Cloudflare account, so deploying creates
# the DNS record and certificate for this hostname. It does not touch the
# apex, www, or the Zoho MX records.
routes = [{ pattern = "feedback.speakoflow.com", custom_domain = true }]

[vars]
FEEDBACK_REPO = "AbhishekBarali/speakoflow-feedback"

# Rate limits are counted per Cloudflare location, not worldwide, and the
# period can only be 10 or 60 seconds. The budget they protect is GitHub's:
# at most 500 content-creating API calls an hour per credential, after which
# every report fails until the hour is up. A report is one call for the issue
# plus one per screenshot (up to three), so in one location the worst case is
# GLOBAL + 3 × ATTACHMENT calls a minute: 4 + 3 × 1 = 7, or 420 an hour.
# Real feedback arrives a few times a day; anyone over a limit is told to try
# again in a minute and keeps their draft.

# Per client address: a person reporting several things in a row is fine, a
# loop is not.
[[ratelimits]]
name = "PER_CLIENT_LIMIT"
namespace_id = "7301"
simple = { limit = 5, period = 60 }

# Everyone together: keeps a flood inside GitHub's quota and stops a burst
# from burying real reports.
[[ratelimits]]
name = "GLOBAL_LIMIT"
namespace_id = "7302"
simple = { limit = 4, period = 60 }

# Reports that carry screenshots, everyone together. Screenshots are what grow
# the repository (each is capped at 1 MB and usually a few hundred KB) and
# cost one API call each, so they get the tightest budget. Over it, the report
# is still filed and the issue notes the missing images.
[[ratelimits]]
name = "ATTACHMENT_LIMIT"
namespace_id = "7303"
simple = { limit = 1, period = 60 }

[observability]
enabled = true

# Keep the Worker's own log lines (issue number, kind, failures) but not the
# per-request invocation log, which would store every sender's IP address and
# request headers in Cloudflare for days. The privacy policy says the IP is
# not kept; this is what makes that true.
[observability.logs]
invocation_logs = false
