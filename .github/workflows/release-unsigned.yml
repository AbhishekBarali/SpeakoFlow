name: "Release (unsigned)"

# Manually-triggered UNSIGNED release. Creates a DRAFT GitHub Release and builds
# the mainstream desktop targets via the reusable build.yml with
# sign-binaries: false — so it needs NO Apple/Azure certificates and NO Tauri
# updater key (build.yml auto-neutralizes the signCommand + createUpdaterArtifacts
# for unsigned builds). The installers attach to the draft release; a maintainer
# reviews and clicks "Publish".
#
# Trade-offs of an unsigned release (intentional, for an early build):
#   * Windows SmartScreen warns ("unknown publisher").
#   * macOS Gatekeeper reports "SpeakoFlow is damaged and can't be opened" — the
#     app is fine; an unsigned bundle carrying the download quarantine flag has
#     no Apple-recognized signature, and macOS 15/26 offers no GUI override for
#     that case. Users clear it once per installed version with
#     `xattr -dr com.apple.quarantine /Applications/SpeakoFlow.app`.
#     See the macOS section of README.md — keep the two in sync.
#   * Auto-update is disabled (no signed updater artifacts), so every platform
#     ships its full installer here and users update by downloading again.
# Use the signed release.yml once signing secrets are configured
# (Apple Developer ID + notarization, Azure Trusted Signing, updater key).
#
# Targets: the full release.yml matrix minus Intel macOS. This deliberately
# mirrors release.yml target-for-target so an unsigned early release is never
# *narrower* than a signed one — an unsigned build is a signing trade-off, not a
# platform-support trade-off. Intel macs and Debian/Ubuntu (.deb) in particular
# had no artifact at all while this workflow only built three targets.
#
# Intel macOS (x86_64-apple-darwin) is intentionally NOT built. GitHub retired
# the last Intel macOS runner (macos-13) on 2025-12-04, and every remaining
# label (macos-latest/14/15/26) is arm64 — so an Intel build would be an
# arm64->x86_64 cross-compile. build.yml has no macOS cross-compile setup (no
# CMAKE_OSX_ARCHITECTURES), and the vendored CMake-built C++ (whisper.cpp/ggml,
# llama.cpp) would compile for the host arch and fail to link. The target has
# never built green here. Adding it back needs a green test-build.yml run first,
# not a release. GitHub also drops macOS x86_64 entirely after the macOS 15
# image retires in Fall 2027.

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # Apple Silicon (M1+)
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "ubuntu-22.04" # .deb on 22.04 (older glibc = wider compat)
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # AppImage + .rpm on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest" # .msi + NSIS .exe
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # ARM64 Windows
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "speakoflow"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore a possibly-stale cache.
      no-cache: true
    secrets: inherit
