name: "Release (unsigned)"

# Manually-triggered UNSIGNED release. Creates a DRAFT GitHub Release and builds
# the mainstream desktop targets via the reusable build.yml with
# sign-binaries: false — so it needs NO Apple/Azure certificates and NO Tauri
# updater key (build.yml auto-neutralizes the signCommand + createUpdaterArtifacts
# for unsigned builds). The installers attach to the draft release; a maintainer
# reviews and clicks "Publish".
#
# Trade-offs of an unsigned release (intentional, for an early build):
#   * Windows SmartScreen warns ("unknown publisher").
#   * macOS Gatekeeper reports "SpeakoFlow is damaged and can't be opened" — the
#     app is fine; an unsigned bundle carrying the download quarantine flag has
#     no Apple-recognized signature, and macOS 15/26 offers no GUI override for
#     that case. Users clear it once per installed version with
#     `xattr -dr com.apple.quarantine /Applications/SpeakoFlow.app`.
#     See the macOS section of README.md — keep the two in sync.
#   * Auto-update is disabled (no signed updater artifacts), so every platform
#     ships its full installer here and users update by downloading again.
# Use the signed release.yml once signing secrets are configured
# (Apple Developer ID + notarization, Azure Trusted Signing, updater key).
#
# Targets: exactly what test-build.yml has proven. Nothing is added here that
# has not had a green Test Build run first — Test Build #8 exposed three targets
# that release.yml had listed for months without ever building once.
#
# Deliberately absent, with reasons (see test-build.yml for the detail):
#   * ubuntu-22.04 — cannot compile; xcap's pipewire/libspa needs newer libspa
#     headers than 22.04 ships. The .deb is built on 24.04 instead, so it wants
#     24.04-era glibc; older distros should use the AppImage.
#   * .rpm — Tauri's rpm bundler omits the engine libs and an .rpm cannot be
#     unpacked/repacked the way a .deb can.
#   * windows-11-arm — whisper-rs-sys requires VULKAN_SDK and build.yml's Vulkan
#     setup is gated to non-aarch64 Windows.

on:
  workflow_dispatch:
    inputs:
      release-id:
        description: >-
          Existing draft release ID to upload into. Leave empty to have the
          workflow create the draft itself.
        required: false
        type: string

# WHY the release-id input exists: a GitHub Release is authored by whoever
# created it, and that CANNOT be changed afterwards. When this workflow creates
# the draft with the default GITHUB_TOKEN, the release is authored by
# `github-actions[bot]` — which is what happened to v1.1.0, so the maintainer's
# name is nowhere on it. To get proper attribution, create the draft yourself
# first and pass its ID in:
#
#   gh release create v1.1.1 --draft --title v1.1.1 --notes-file NOTES.md
#   gh release view v1.1.1 --json id --jq .id
#   gh workflow run release-unsigned.yml -f release-id=<that id>
#
# Everything else is unchanged; the builds just attach to your release instead
# of a bot's.

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.resolve-release.outputs.id }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        if: ${{ inputs.release-id == '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

      # Resolve which release the build jobs upload into, and refuse to touch a
      # release whose tag does not match the version being built — uploading a
      # 1.1.1 build into the v1.1.0 release would silently corrupt a published
      # download.
      - name: Resolve release id
        id: resolve-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPPLIED_ID: ${{ inputs.release-id }}
          CREATED_ID: ${{ steps.create-release.outputs.result }}
          VERSION: ${{ steps.get-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPPLIED_ID}" ]; then
            TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${SUPPLIED_ID}" --jq .tag_name)"
            AUTHOR="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${SUPPLIED_ID}" --jq .author.login)"
            DRAFT="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${SUPPLIED_ID}" --jq .draft)"
            echo "Supplied release ${SUPPLIED_ID}: tag=${TAG} author=${AUTHOR} draft=${DRAFT}"
            if [ "${TAG}" != "v${VERSION}" ]; then
              echo "ERROR: release ${SUPPLIED_ID} is tagged ${TAG} but this build is v${VERSION}" >&2
              exit 1
            fi
            if [ "${DRAFT}" != "true" ]; then
              echo "ERROR: release ${SUPPLIED_ID} is already published; refusing to overwrite its assets" >&2
              exit 1
            fi
            echo "id=${SUPPLIED_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "No release-id supplied; using the draft this workflow just created (${CREATED_ID})."
            echo "NOTE: it will be authored by github-actions[bot], not you."
            echo "id=${CREATED_ID}" >> "$GITHUB_OUTPUT"
          fi


  publish:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # Apple Silicon (M1+)
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          # Intel Macs, CPU only (the GPU backend targets Apple Silicon). Promoted
          # here after test-build.yml went green twice AND its Intel audit proved
          # the bundle starts on a real Intel runner with Homebrew's onnxruntime,
          # onnx, protobuf, re2 and abseil moved out of /usr/local/opt. That
          # clean-room launch is what #19 needed and never had: checks on the main
          # binary's own load commands pass on a bundle that cannot start.
          - platform: "macos-15-intel"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-24.04" # AppImage + .deb, x86_64
            args: "--bundles appimage,deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # AppImage + .deb, ARM64
            args: "--bundles appimage,deb"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest" # .msi + NSIS .exe
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "speakoflow"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore a possibly-stale cache.
      no-cache: true
    secrets: inherit
