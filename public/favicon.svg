<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>SpeakoFlow</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38c6c0"/>
      <stop offset="1" stop-color="#04616e"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.3" cy="0.24" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="32" height="32" rx="7.200" ry="7.200"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tileClip)">
    <rect x="0" y="0" width="32" height="32" fill="url(#tile)"/>
    <rect x="0" y="0" width="32" height="32" fill="url(#gloss)"/>
    <rect x="5" y="14" width="3" height="5" rx="1.500" ry="1.500" fill="#ffffff"/>
    <rect x="10" y="11" width="3" height="10" rx="1.500" ry="1.500" fill="#ffffff"/>
    <rect x="15" y="9" width="3" height="15" rx="1.500" ry="1.500" fill="#ffffff"/>
    <rect x="20" y="11" width="3" height="10" rx="1.500" ry="1.500" fill="#ffffff"/>
    <rect x="25" y="14" width="3" height="5" rx="1.500" ry="1.500" fill="#ffffff"/>
  </g>
</svg>
